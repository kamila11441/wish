<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>wish</title>
<link rel="icon" href="wish.jpg"><link rel="apple-touch-icon" href="wish.jpg"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="wish"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#536593">
<style>
:root{--ink:#26304a;--accent:#536593;--paper:#fffdf8}
@media (prefers-color-scheme:dark){:root{--ink:#e9edf8;--paper:#1f2740;--accent:#8fa3d8}}
html,body{height:100%;margin:0;overflow:hidden;background:#cfe0f7;font-family:"Avenir Next",Nunito,system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:none}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
button{font:inherit;border:0;border-radius:999px;background:var(--paper);color:var(--ink);padding:10px 16px;box-shadow:0 2px 10px #0002;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#plus{width:56px;height:56px;padding:0;font-size:30px;background:var(--accent);color:#fff}
#hint{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:15px;pointer-events:none;transition:opacity 1s;color:#fff;text-shadow:0 1px 6px #0006}
dialog{border:0;border-radius:20px;background:var(--paper);color:var(--ink);padding:20px;width:min(92vw,380px);box-shadow:0 10px 40px #0005}
dialog::backdrop{background:#0006}
textarea,input{width:100%;box-sizing:border-box;font:inherit;padding:10px;border-radius:12px;border:1px solid #8a93ad88;background:transparent;color:inherit;margin:6px 0}
textarea{height:110px;resize:none}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.main{background:var(--accent);color:#fff}
.item{padding:10px 0;border-bottom:1px solid #8a93ad44}.item small,#rm{opacity:.7}
#list{max-height:55vh;overflow:auto}
</style></head><body>
<canvas id="c"></canvas><div id="hint">tap the ground to plant a wish</div>
<div class="bar"><button id="shelf">notes</button><button id="think">💭 thinking of you</button><button id="snd" aria-label="Sound">🔇</button><button id="plus" aria-label="Add something you thought was dumb to say">+</button></div>
<dialog id="add"><b>something I wanted to tell you today but thought it was dumb</b>
<textarea id="body" maxlength="280" placeholder="it's not dumb. write it here"></textarea>
<input id="day" type="date" aria-label="date"><input id="nm" maxlength="40" placeholder="your name (optional)">
<small id="msg"></small><div class="row"><button id="cx">Cancel</button><button class="main" id="sv">Save</button></div></dialog>
<dialog id="rd"><div id="rt" style="font-size:18px;line-height:1.45"></div><small id="rm"></small><div class="row"><button id="rc">Close</button></div></dialog>
<dialog id="sh"><b>things I thought were dumb to say</b><div id="list"></div><div class="row"><button id="sc">Close</button></div></dialog>
<script src="config.js"></script>
<script>
const G=window.GARDEN||{},$=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const NOTES=["there’s music in the way you see things 🎶","I am sure you smell good today!","you are proof that grace can have a backbone","I admire how you notice when someone needs a little extra care","you make ordinary days a little kinder","believe you can and you’re halfway there","someone is thinking about you right now","you’re allowed to take the slow way today","you make me want to be a little more patient","a tiny wish: something delicious for you today","you are a very good hooman","today is already better with you in it"];
const CL=["#f7a8b8","#ffd36b","#ffffff","#c3b1f0","#9fd8f0","#ffb98a"];
const BASE=[[-1,.2,.45],[-.5,-.1,.5],[0,-.25,.55],[.55,-.05,.5],[1,.2,.45],[-.3,.25,.45],[.4,.25,.45]];
const SH={cat:[[0,.15,.6],[-.45,-.4,.22],[.45,-.4,.22],[-.3,-.2,.35],[.3,-.2,.35],[-.35,.45,.3],[.35,.45,.3]],
heart:[[-.45,-.2,.5],[.45,-.2,.5],[-.7,.1,.4],[.7,.1,.4],[-.35,.35,.4],[.35,.35,.4],[0,.6,.35]],
potato:[[-.8,.1,.42],[-.4,-.2,.5],[.1,-.25,.5],[.6,-.1,.5],[.85,.2,.4],[-.2,.3,.5],[.4,.3,.5]],
duckling:[[-.2,.2,.55],[-.7,.3,.4],[.3,.3,.4],[.5,-.3,.35],[.65,-.45,.3],[1,-.35,.14],[0,.45,.4]]};
const NM={cat:'a cat',heart:'a heart',potato:'a potato',duckling:'a duckling'};
const GD=[200,226,205],GN=[36,54,70],NT=[27,36,64],NB=[58,74,120],DT=[207,224,247],DB=[244,248,255];
const rnd=(a,b)=>a+Math.random()*(b-a),lp=(a,b,t)=>a+(b-a)*t,ez=t=>t*t*(3-2*t);
const mx=(p,q,t)=>'rgb('+p.map((v,i)=>Math.round(lp(v,q[i],t))).join()+')';
const hs=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
let W,H,D,hz,T=0,last=0,a=1,fl=[],cs=[],notes=[],bee=null,hold=null,dn=null,snd=false,ac=null;
const ST=Array.from({length:40},()=>[Math.random(),Math.random()*.9,Math.random()*1.5+.5]);
function rs(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);hz=H*.58}
addEventListener('resize',rs);rs();
for(let i=0;i<4;i++)cs.push({x:rnd(0,W),y:rnd(H*.08,hz*.6),s:rnd(.7,1.1),v:rnd(6,14),p:0,tp:0,h:0,sh:'cat'});
const np=n=>{const k=n.id||n.body;return[30+hs(k)%Math.max(1,W-60),hz+50+hs(k+'y')%Math.max(40,H-hz-150)]};
function frame(now){
const dt=Math.min(.05,(now-last)/1000||0);last=now;T+=dt;
a=(Math.sin(T/120*6.2832+1.5708)+1)/2;
const g=x.createLinearGradient(0,0,0,hz);g.addColorStop(0,mx(NT,DT,a));g.addColorStop(1,mx(NB,DB,a));
x.fillStyle=g;x.fillRect(0,0,W,H);
x.fillStyle='rgba(255,170,150,'+(1-Math.abs(2*a-1))*.2+')';x.fillRect(0,0,W,hz);
if(a<.45){x.fillStyle='rgba(255,255,255,'+(.45-a)*2+')';ST.forEach(s=>{x.beginPath();x.arc(s[0]*W,s[1]*hz,s[2],0,7);x.fill()})}
cs.forEach(c=>{c.x+=c.v*dt*(RM?.2:1);if(c.x>W+150)c.x=-150;
if(c.p<c.tp)c.p=Math.min(c.tp,c.p+dt/1.2);else if(c.p>c.tp)c.p=Math.max(c.tp,c.p-dt/1.2);
if(c.p>=1&&c.tp===1){c.h+=dt;if(c.h>3.5){c.tp=0;c.h=0}}
const e=ez(c.p);x.globalAlpha=.93;x.fillStyle=mx([150,165,200],[255,255,255],a);
BASE.forEach((b,j)=>{const s=SH[c.sh][j];x.beginPath();x.arc(c.x+lp(b[0],s[0],e)*90*c.s,c.y+lp(b[1],s[1],e)*90*c.s,lp(b[2],s[2],e)*90*c.s,0,7);x.fill()});
x.globalAlpha=1;
if(e>.7){x.globalAlpha=(e-.7)/.3;x.fillStyle=mx([230,235,250],[83,101,147],a);x.font='14px system-ui';x.textAlign='center';x.fillText(NM[c.sh],c.x,c.y+72*c.s);x.globalAlpha=1}});
x.fillStyle=mx(GN,GD,a);x.beginPath();x.moveTo(0,hz);x.quadraticCurveTo(W/2,hz-34,W,hz);x.lineTo(W,H);x.lineTo(0,H);x.fill();
notes.slice(0,14).forEach(n=>{const p=np(n);x.save();x.translate(p[0],p[1]);x.rotate(((hs(n.id||n.body)%20)-10)/30);x.fillStyle='#fffdf5';x.fillRect(-9,-7,18,14);x.strokeStyle='#536593';x.lineWidth=1;x.strokeRect(-9,-7,18,14);x.beginPath();x.moveTo(-9,-7);x.lineTo(0,1);x.lineTo(9,-7);x.stroke();x.restore()});
if(hold&&performance.now()-hold.t>450){hold.done=true;const f=hold.f;f.w=Math.min(1,f.w+dt*.7);x.fillStyle='#8cc3f0';for(let i=0;i<3;i++){x.beginPath();x.arc(f.hx-8+i*8,f.hy-34+(T*80+i*20)%40,2.5,0,7);x.fill()}}
fl.slice().sort((p,q)=>p.y-q.y).forEach(f=>{f.g=Math.min(1,f.g+dt*.4);
const z=(1+f.w*.6)*ez(f.g),sw=RM?0:Math.sin(T*1.2+f.x)*4*z,hx=f.x+sw,hy=f.y-46*z;
x.strokeStyle=mx([40,90,60],[90,150,100],a);x.lineWidth=3*z;x.beginPath();x.moveTo(f.x,f.y);x.quadraticCurveTo(f.x,f.y-24*z,hx,hy);x.stroke();
x.shadowColor=f.c;x.shadowBlur=(1-a)*20;x.fillStyle=f.c;
for(let k=0;k<6;k++){const an=k*1.0472+T*.1;x.beginPath();x.arc(hx+Math.cos(an)*11*z,hy+Math.sin(an)*11*z,9*z,0,7);x.fill()}
x.fillStyle='#ffd45e';x.beginPath();x.arc(hx,hy,7*z,0,7);x.fill();x.shadowBlur=0;f.hx=hx;f.hy=hy;f.z=z});
if(!bee&&Math.random()<dt/25)bee={x:-20,y:rnd(hz*.5,hz+60),vx:rnd(40,60),hop:0,y0:0};
if(bee){bee.x+=bee.vx*dt;bee.y0=bee.y0||bee.y;bee.y=bee.y0+Math.sin(T*3)*10;if(bee.hop>0)bee.hop=Math.max(0,bee.hop-dt*1.5);
const by=bee.y-Math.sin(bee.hop*3.1416)*30;x.fillStyle='#ffd45e';x.beginPath();x.ellipse(bee.x,by,8,5.5,0,0,7);x.fill();
x.fillStyle='#2b2b3a';x.fillRect(bee.x-2,by-5,2.5,10);x.fillStyle='rgba(255,255,255,.8)';x.beginPath();x.arc(bee.x-2,by-7-Math.sin(T*40)*1.5,4,0,7);x.fill();
if(bee.x>W+30)bee=null}
requestAnimationFrame(frame)}
function hit(px,py){
for(const f of fl.slice().reverse())if(Math.hypot(px-f.hx,py-f.hy)<22*f.z+10)return{k:'f',o:f};
for(const n of notes.slice(0,14)){const p=np(n);if(Math.abs(px-p[0])<16&&Math.abs(py-p[1])<14)return{k:'n',o:n}}
if(bee&&Math.hypot(px-bee.x,py-bee.y)<24)return{k:'b'};
for(const c of cs)if(Math.abs(px-c.x)<100*c.s&&Math.abs(py-c.y)<65*c.s)return{k:'c',o:c};
return py>hz+8?{k:'g'}:null}
const fmt=n=>new Date(n.day+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})+(n.name?' · from '+n.name:'');
const show=(t,m)=>{$('rt').textContent=t;$('rm').textContent=m;$('rd').showModal()};
const flash=t=>{const h=$('hint');h.textContent=t;h.style.opacity=1;setTimeout(()=>{h.style.opacity=0},3500)};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function plant(px,py){if(fl.length>=60)fl.shift();fl.push({x:px,y:py,g:0,w:0,c:CL[Math.random()*CL.length|0],note:NOTES[Math.random()*NOTES.length|0]});$('hint').style.opacity=0;play()}
function play(){if(!snd||!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='sine';o.frequency.value=[392,440,523,587,659,784][Math.random()*6|0];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+1.4);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+1.5)}
cv.onpointerdown=e=>{const t=hit(e.clientX,e.clientY);dn={t,x:e.clientX,y:e.clientY};if(t&&t.k==='f')hold={f:t.o,t:performance.now(),done:false}};
cv.onpointermove=e=>{if(dn&&Math.hypot(e.clientX-dn.x,e.clientY-dn.y)>12){dn=null;hold=null}};
cv.onpointerup=()=>{if(!dn)return;const t=dn.t;
if(t){if(t.k==='f'){if(!hold||!hold.done)show(t.o.note,'')}
else if(t.k==='n')show(t.o.body,fmt(t.o));
else if(t.k==='b')bee.hop=1;
else if(t.k==='c'){t.o.sh=Object.keys(SH)[Math.random()*4|0];t.o.tp=1;t.o.h=0}
else plant(dn.x,dn.y)}
hold=null;dn=null};
cv.onpointercancel=()=>{dn=null;hold=null};
$('snd').onclick=()=>{snd=!snd;if(snd&&!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){snd=false}$('snd').textContent=snd?'🔊':'🔇'};
$('plus').onclick=()=>{$('day').value=today();$('msg').textContent='';$('add').showModal()};
$('cx').onclick=()=>$('add').close();$('rc').onclick=()=>$('rd').close();$('sc').onclick=()=>$('sh').close();
$('shelf').onclick=()=>{const l=$('list');l.textContent='';if(!notes.length)l.textContent='Nothing here yet. Tap + to add the first one.';
notes.forEach(n=>{const d=document.createElement('div'),p=document.createElement('div'),s=document.createElement('small');d.className='item';p.textContent=n.body;s.textContent=fmt(n);d.append(p,s);l.append(d)});$('sh').showModal()};
const hd=()=>G.key.startsWith('sb_')?{apikey:G.key}:{apikey:G.key,Authorization:'Bearer '+G.key};
$('sv').onclick=async()=>{const b=$('body').value.trim();if(!b){$('msg').textContent='Write something first.';return}
const e={body:b,name:$('nm').value.trim()||null,day:$('day').value||today()};
try{if(G.url){const r=await fetch(G.url+'/rest/v1/garden_notes',{method:'POST',headers:{...hd(),'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(e)});if(!r.ok)throw 0;flash('Saved. It shows up once it is approved.')}
else{e.id='l'+Date.now();notes.unshift(e);try{localStorage.setItem('w',JSON.stringify(notes))}catch(_){}flash('Saved on this device.')}
$('body').value='';$('add').close()}catch(_){$('msg').textContent='Could not save. Try again.'}};
async function load(){try{if(G.url){const r=await fetch(G.url+'/rest/v1/garden_notes?select=id,body,name,day&approved=eq.true&order=day.desc,created_at.desc&limit=200',{headers:hd()});const j=await r.json();notes=Array.isArray(j)?j:[]}
else notes=JSON.parse(localStorage.getItem('w')||'[]')}catch(e){notes=[]}}
$('think').onclick=async()=>{const b=$('think');if(b.disabled)return;b.disabled=true;setTimeout(()=>{b.disabled=false},30000);
try{if(G.url){const r=await fetch(G.url+'/functions/v1/wish-ping',{method:'POST',headers:{...hd(),'Content-Type':'application/json'},body:JSON.stringify({action:'ping',name:$('nm').value.trim()})});if(!r.ok)throw 0;flash('Sent. They’ll get a little notification.')}
else flash('Sent (demo mode, nobody is notified).');
const c=cs[Math.random()*cs.length|0];c.sh='heart';c.tp=1;c.h=0}catch(_){b.disabled=false;flash('Could not send. Try again in a moment.')}};
load();requestAnimationFrame(frame);
</script></body></html>
